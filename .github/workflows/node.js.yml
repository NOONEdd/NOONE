# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    # No "test" script exists in package.json yet (npm test with none
    # defined fails the whole workflow with "Missing script: test").
    # Add one and restore this step whenever real tests get written:
    # - run: npm test

  # Scenario Engine (functions/_lib/decisionLab). These are engineering and
  # regression tests: expected values come from code contracts and from the
  # DRAFT rule table, so passing them is NOT coach approval. Coach-approved
  # Golden cases do not exist yet and are not part of this job. The engine has
  # no npm dependencies, so no install step is needed, and this job does not
  # depend on the build job or on the repository's other test files.
  #
  # Runtimes: the supported Node LTS lines are required (22.x, 24.x); the
  # current release line runs as an optional, non-blocking check. Node 18 and
  # 20 are end-of-life and are not tested here: in production the engine runs
  # inside Cloudflare Pages Functions (not Node), and nothing in the project
  # pins an older Node. Mark only the 22.x and 24.x checks as required.
  scenario-engine:
    name: Scenario Engine tests (engineering regression pins, not coach-approved Golden cases)

    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        optional: [false]
        include:
          - node-version: 26.x
            optional: true

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm run test:engine
